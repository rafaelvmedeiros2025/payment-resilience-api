services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments
    depends_on:
      postgres: {condition: service_healthy}
  provider:
    build: .
    command: ["node", "dist/src/provider-server.js"]
    environment:
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments
    ports: ["127.0.0.1:4001:4000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    init: true
  api:
    build: .
    environment:
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments
    ports: ["127.0.0.1:3001:3000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    init: true
  worker:
    build: .
    command: ["node", "dist/src/run-worker.js"]
    environment:
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments
      PROVIDER_URL: http://provider:4000
      PROVIDER_TIMEOUT_MS: 300
    depends_on:
      provider: {condition: service_healthy}
    init: true
volumes:
  pgdata:
